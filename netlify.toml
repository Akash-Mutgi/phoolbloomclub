# Netlify configuration — Phool Bloom Club

[build]
  # Static site — no build command needed
  publish = "."
  functions = "functions"

# Pretty URL: /api/subscribe → /.netlify/functions/kit-subscribe
[[redirects]]
  from = "/api/subscribe"
  to = "/.netlify/functions/kit-subscribe"
  status = 200
  force = true

# Pretty URL: /api/create-subscription → /.netlify/functions/create-subscription
[[redirects]]
  from = "/api/create-subscription"
  to = "/.netlify/functions/create-subscription"
  status = 200
  force = true

# Pretty URL: /api/razorpay-webhook → /.netlify/functions/razorpay-webhook
[[redirects]]
  from = "/api/razorpay-webhook"
  to = "/.netlify/functions/razorpay-webhook"
  status = 200
  force = true

# Pretty URL: /api/sync-subscribers → /.netlify/functions/sync-subscribers
[[redirects]]
  from = "/api/sync-subscribers"
  to = "/.netlify/functions/sync-subscribers"
  status = 200
  force = true

# Default 200 for the root
[[redirects]]
  from = "/"
  to = "/index.html"
  status = 200

# ── Cache headers ──────────────────────────────────────────────────────
# HTML must always revalidate so a deploy is picked up on the next request
# rather than sitting behind a cached copy.
#
# NOTE: this is what Netlify already sends by default. Pinning it here is
# a guarantee, not a fix — it means the behaviour cannot drift if those
# defaults ever change. Assets (js, images, zip) are deliberately NOT
# given rules here and keep Netlify's defaults.

[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Directory indexes are requested as "/welcome/", a path that does not end
# in .html, so the rule above does not match them. Every such index has to be
# listed explicitly — there are five.
[[headers]]
  for = "/welcome/"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/thank-you/"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/checkout/desi/"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/checkout/global/"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/privacy/"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# razorpay-checkout.js decides where every Subscribe button points, so a
# stale copy can send a visitor to a checkout we have closed. It must
# revalidate on every request, like the HTML. The <script> tag also carries
# a ?v= query so a URL change forces a fetch regardless of what a browser
# already holds — bump that version whenever this file's behaviour changes.
[[headers]]
  for = "/razorpay-checkout.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# consent.js decides whether GA4 is loaded at all. A stale copy would mean a
# visitor's stored choice is read by outdated logic, so it must revalidate on
# every request rather than sit in a CDN cache.
[[headers]]
  for = "/consent.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
